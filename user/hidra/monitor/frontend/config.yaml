# HiDRA monitor frontend configuration.
#
# All layout is declared here. Panel types are implemented in
# `hidra_frontend/panels/`. To add a custom layout/behaviour for a tab,
# implement a new Panel class, register it in
# `hidra_frontend/panels/__init__.py`, then reference its type name here.

backend:
  url: http://localhost:9090
  request_timeout_s: 2.0

# Histogram decoder.
#   pure   - parses the TBufferJSON payload directly with numpy. Fast,
#            self-contained, default.
#   pyroot - round-trip through ROOT.TBufferJSON.ConvertFromJSON. Slower
#            (2-200x), keeps a global lock. Useful as a fallback if the
#            pure decoder doesn't yet handle a payload shape.
decoder: pure

polling:
  default_ms: 500
  floor_ms: 50
  choices_ms: [100, 200, 500, 1000, 2000, 5000]
  # Static mirror of the backend PUMP_INTERVAL_MS (set in dry.ini /
  # hidra.ini under [Monitor.HidraHttpMonitor]). Shown in the status
  # bar so the user knows the server-side refresh cadence. Not enforced
  # at runtime.
  server_pump_ms_hint: 20

overlay:
  enabled: true
  # Frontend scans this directory for *.root files. Future backend will
  # write reference snapshots here.
  search_dir: reference
  default_file: null

# Per-histogram display options, keyed by histogram name. They apply
# wherever that histogram is shown (any tab/panel). Both default to false.
#   logx    - logarithmic x-axis (only when all bin edges are positive).
#   density - divide each bin by its width, so non-uniform binning shows a
#             comparable height per unit x instead of raw per-bin counts.
histogram_options:
  dt_between_events:
    logx: true
    density: true

# Ambient UI effects (the "cosmic-ray shower" particle animation). The
# animation is always available on demand via a triple-click on the title;
# this section only controls the automatic once-a-day trigger.
ui_effects:
  # Local hour (0-23) at which the daily shower fires. Set to null to
  # disable the automatic trigger entirely (e.g. for production /
  # control-room screens, so nothing animates unexpectedly).
  shower_hour: 0

tabs:
  - id: summary
    label: Summary
    panels:
      # Run header on one row: live event rate (Hz) from the true
      # pre-prescale counter `events_received`, its sparkline, and the
      # total event count.
      - type: rate
        histogram: events_received
        count_histogram: event_count
        smoothing: 0.9  # alpha for exponential smoothing of the sparkline; 1 = no smoothing
      # Detector map: every module drawn at its (row, column) position,
      # coloured by mean ADC of the *physics* events. Two figures: S
      # channels and C channels. `link_tab` makes the modules clickable:
      # clicking one opens that tab's channel selector on the clicked channel.
      - type: detector
        histogram: ADC_mean_physics
        label: "mean ADC (physics)"
        height: 550px  # optional per-panel parameter, default is 320px
        link_tab: adc_channels
      # Per-event metadata histograms (filled by MetaFiller on the backend):
      #   trigger_mask       - gate / physics / pedestal / both
      #   detectors_present  - one bin per detID, counts when each is present
      #   events_per_spill   - event multiplicity vs spill number
      #   dt_between_events  - inter-event time, log-binned (see
      #                        histogram_options below for logx + density)
      - type: histograms
        cols: 2
        histograms: [trigger_mask, detectors_present, events_per_spill, dt_between_events]

  # Main ADC views show the physics events only; the pedestal lives in the
  # dedicated "ADC noise" tab and the per-channel comparison in "ADC channels".
  - id: xdc
    label: ADC
    panels:
      - type: histograms
        cols: 2
        histograms: [ADC_inclusive_physics]
      - type: histograms
        cols: 2
        histograms: [ADC_mean_physics]

  - id: tdc
    label: TDC
    panels:
      - type: histograms
        cols: 2
        histograms: [TDC_inclusive]
      - type: histograms
        cols: 2
        histograms: [TDC_mean]

  # Per-channel ADC inspection: one histogram at a time, with a dropdown
  # to pick the channel. Channels are auto-discovered from the backend
  # (every ADC_channel_<N> it exposes), so the list always matches the
  # current VME geo map. To pin an explicit set instead, add a
  # `range: [lo, hi]` next to `template`.
  - id: adc_channels
    label: ADC channels
    panels:
      # `show_trigger_split` overlays the inclusive histogram with its
      # physics/pedestal copies of the selected channel in one plot. Use the
      # Plotly legend to hide/show each series (all visible by default).
      - type: channel_selector
        template: "ADC_channel_{ch}"
        show_trigger_split: true

  - id: adc_saturation
    label: ADC Saturation
    panels:
      - type: histograms
        cols: 1
        histograms: [ADC_saturation_physics]
      - type: detector
        histogram: ADC_saturation_physics
        label: "sat. fraction (physics)"
        height: 550px
        link_tab: adc_channels

  # Pedestal-only views: the per-channel mean and the robust noise.
  # ADC_noise_pedestal is computed on the backend as IQR/1.349 of each
  # channel's pedestal distribution (robust to outliers, unlike the std
  # dev), exposed as one value per channel.
  - id: adc_noise
    label: ADC noise
    panels:
      - type: histograms
        cols: 1
        histograms: [ADC_mean_pedestal]
      - type: detector
        histogram: ADC_mean_pedestal
        label: "mean ADC (pedestal)"
        height: 550px
        link_tab: adc_channels
      # Per-channel noise, both estimators overlaid: robust IQR/1.349 and the
      # (outlier-sensitive) std dev. Toggle either via the legend.
      - type: overlay
        title: "Pedestal noise per channel"
        per_channel: true
        histograms: [ADC_noise_pedestal, ADC_noise_std_pedestal]
        labels: ["IQR/1.349", "std"]
      # The heatmap uses the robust estimator only.
      - type: detector
        histogram: ADC_noise_pedestal
        title_tag: noise
        label: "noise (IQR/1.349)"
        height: 550px
        link_tab: adc_channels
